[build]
  publish = "."

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# NOTE: no catch-all SPA redirect — this is a pure static site with no
# client-side routing. A "/* -> /index.html" redirect would swallow real
# files (app.js, data/*.json) and return the HTML shell for everything.
